# Copied into the public illini-mealtimes repo by scripts/deploy.sh.
# Publishes the site with a fresh week of dining menus on every publish and every morning.
name: Publish site with fresh menus

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *" # 5am in Champaign during daylight time, 4am in winter
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # If the menu feed is down, this fails and the previous day's site stays up.
      - run: node scripts/fetch-menus.mjs site/menus
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
